<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Beatify — Offline</title>
    <!-- #1761: fully self-contained (inline styles, no network deps) so it
         renders when the network is down and no other asset is cached. -->
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f2f2f7;
            background: radial-gradient(circle at 50% 30%, #241a3a 0%, #0e0b18 70%);
        }
        .offline-emoji { font-size: 3.5rem; line-height: 1; }
        h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
        p { margin: 0; max-width: 22rem; color: rgba(242, 242, 247, 0.7); line-height: 1.5; }
        button {
            margin-top: 0.5rem;
            padding: 0.85rem 2rem;
            min-height: 44px;
            font-size: 1rem;
            font-weight: 600;
            color: #0e0b18;
            background: #b072ff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="offline-emoji" aria-hidden="true">🎵📴</div>
    <h1 id="offline-title">You're offline</h1>
    <p id="offline-text">Beatify can't reach the server right now. Check your Wi-Fi or connection and try again.</p>
    <button type="button" id="offline-retry" onclick="location.reload()">Retry</button>
    <!-- #3057: the same three lines in the six game languages. Inline for the
         same reason the styles are: nothing else is guaranteed to be cached.
         English stays in the markup above as the no-JS / unknown-language
         fallback. Language: the guest's own pick, then the language of the
         last game on this device, then the browser's. -->
    <script>
    (function () {
        var T = {
            en: ["You're offline",
                 "Beatify can't reach the server right now. Check your Wi-Fi or connection and try again.",
                 "Retry"],
            de: ["Du bist offline",
                 "Beatify erreicht den Server gerade nicht. Prüfe dein WLAN bzw. deine Verbindung und versuche es erneut.",
                 "Erneut versuchen"],
            es: ["Estás sin conexión",
                 "Beatify no puede conectar con el servidor ahora mismo. Comprueba tu Wi-Fi o tu conexión e inténtalo de nuevo.",
                 "Reintentar"],
            fr: ["Tu es hors ligne",
                 "Beatify ne parvient pas à joindre le serveur pour le moment. Vérifie ton Wi-Fi ou ta connexion et réessaie.",
                 "Réessayer"],
            nl: ["Je bent offline",
                 "Beatify kan de server nu niet bereiken. Controleer je wifi of verbinding en probeer het opnieuw.",
                 "Opnieuw proberen"],
            it: ["Sei offline",
                 "Beatify non riesce a raggiungere il server in questo momento. Controlla il Wi-Fi o la connessione e riprova.",
                 "Riprova"]
        };
        function pick() {
            var stored = [];
            try {
                stored.push(localStorage.getItem('beatify_guest_language'));
                stored.push(localStorage.getItem('beatify_language'));
            } catch (e) { /* storage blocked: fall through to the browser */ }
            var browser = (typeof navigator !== 'undefined' && navigator.languages) || [];
            var candidates = stored.concat(Array.prototype.slice.call(browser),
                typeof navigator !== 'undefined' ? [navigator.language] : []);
            for (var i = 0; i < candidates.length; i++) {
                var code = String(candidates[i] || '').slice(0, 2).toLowerCase();
                if (T[code]) return code;
            }
            return 'en';
        }
        var lang = pick();
        document.documentElement.lang = lang;
        document.getElementById('offline-title').textContent = T[lang][0];
        document.getElementById('offline-text').textContent = T[lang][1];
        document.getElementById('offline-retry').textContent = T[lang][2];
    })();
    </script>
</body>
</html>
