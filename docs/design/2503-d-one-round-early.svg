<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect x="0" y="0" width="640" height="360" fill="#0C0E12"/>

  <text x="24" y="26" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#EDEAE4">Option D — ask one round early, so the finale stays final</text>
  <text x="24" y="42" font-family="Helvetica,Arial" font-size="10" fill="#868C97">The offer sits on the reveal of round 19. Once round 20 starts, nothing can revoke it.</text>

  <!-- timeline -->
  <line x1="40" y1="82" x2="600" y2="82" stroke="#282D38" stroke-width="2"/>
  <circle cx="120" cy="82" r="5" fill="#282D38"/>
  <text x="120" y="102" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#868C97">R18</text>
  <circle cx="260" cy="82" r="7" fill="#E9A13B"/>
  <text x="260" y="102" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#E9A13B">R19 REVEAL</text>
  <text x="260" y="68" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" fill="#E9A13B">offer here</text>
  <circle cx="400" cy="82" r="5" fill="#5BC8C8"/>
  <text x="400" y="102" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#5BC8C8">R20 FINAL</text>
  <text x="400" y="68" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" fill="#868C97">no offer</text>
  <circle cx="540" cy="82" r="5" fill="#282D38"/>
  <text x="540" y="102" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#868C97">END</text>
  <text x="540" y="68" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Rematch only</text>

  <!-- phone -->
  <rect x="176" y="118" width="288" height="222" rx="14" fill="#171A21" stroke="#282D38" stroke-width="1"/>

  <text x="196" y="144" font-family="Menlo,monospace" font-size="11" fill="#868C97">ROUND</text>
  <text x="240" y="144" font-family="Menlo,monospace" font-size="11" fill="#EDEAE4">19 / 20</text>
  <rect x="336" y="132" width="108" height="17" rx="8" fill="#0C0E12" stroke="#868C97" stroke-width="1"/>
  <text x="344" y="144" font-family="Menlo,monospace" font-size="9" fill="#868C97">LAST ROUND NEXT</text>

  <line x1="196" y1="156" x2="444" y2="156" stroke="#282D38" stroke-width="1"/>

  <rect x="196" y="166" width="34" height="34" rx="4" fill="#282D38"/>
  <text x="240" y="180" font-family="Helvetica,Arial" font-size="11" font-weight="bold" fill="#EDEAE4">Tainted Love</text>
  <text x="240" y="193" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Soft Cell</text>
  <text x="392" y="188" font-family="Menlo,monospace" font-size="13" fill="#5BC8C8">1981</text>

  <!-- the single control -->
  <rect x="196" y="214" width="248" height="46" rx="8" fill="#0C0E12" stroke="#E9A13B" stroke-width="1.5"/>
  <text x="210" y="234" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#E9A13B">Make it 5 more</text>
  <text x="210" y="250" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Moves the finish line to 25. Scores stay.</text>
  <text x="410" y="240" font-family="Helvetica,Arial" font-size="16" font-weight="bold" fill="#E9A13B">+5</text>

  <text x="196" y="278" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Tapped twice it says 30. There is no cap</text>
  <text x="196" y="290" font-family="Helvetica,Arial" font-size="9" fill="#868C97">beyond the songs that are left.</text>

  <rect x="196" y="300" width="248" height="30" rx="6" fill="#5BC8C8"/>
  <text x="320" y="320" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#0C0E12">Next Round</text>

  <text x="24" y="140" font-family="Menlo,monospace" font-size="9" fill="#868C97">WHY</text>
  <text x="24" y="156" font-family="Helvetica,Arial" font-size="9" fill="#868C97">A last round that can</text>
  <text x="24" y="168" font-family="Helvetica,Arial" font-size="9" fill="#868C97">be cancelled mid-reveal</text>
  <text x="24" y="180" font-family="Helvetica,Arial" font-size="9" fill="#868C97">was never a last round.</text>
  <text x="24" y="192" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Deciding at R19 keeps</text>
  <text x="24" y="204" font-family="Helvetica,Arial" font-size="9" fill="#868C97">the finale intact.</text>

  <text x="480" y="140" font-family="Menlo,monospace" font-size="9" fill="#868C97">COST</text>
  <text x="480" y="156" font-family="Helvetica,Arial" font-size="9" fill="#868C97">The room asks for</text>
  <text x="480" y="168" font-family="Helvetica,Arial" font-size="9" fill="#868C97">more AFTER the last</text>
  <text x="480" y="180" font-family="Helvetica,Arial" font-size="9" fill="#868C97">song, not before it.</text>
  <text x="480" y="192" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Miss the window and</text>
  <text x="480" y="204" font-family="Helvetica,Arial" font-size="9" fill="#868C97">you are back to</text>
  <text x="480" y="216" font-family="Helvetica,Arial" font-size="9" fill="#868C97">Rematch.</text>
</svg>
