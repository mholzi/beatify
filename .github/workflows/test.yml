# Beatify CI Pipeline
# Runs lint, tests, and coverage on every push/PR
#
# Stages:
# 1. lint     - Code quality checks (ruff)
# 2. test     - Unit and integration tests (pytest)
# 3. burn-in  - Flaky test detection (10 iterations on PR to main)
#
# Performance targets:
# - Lint: <1 min
# - Test: <5 min
# - Burn-in: <15 min (10 iterations)

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly burn-in on schedule
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM UTC

# Cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Home Assistant verlangt seit 2026.3 `requires-python >= 3.14.2` (2026.1 noch
# 3.13.2). Wer die Integration heute betreibt, faehrt sie also auf 3.14 —
# vorher lief hier kein einziger Test dagegen (#2581).
#
# 3.12 bleibt, weil `hacs.json` als Minimum noch HA 2025.1.0 nennt und erst
# 2025.2.0 Python 3.13 verlangt. Faellt dieses Minimum, kann 3.12 mit weg.
env:
  PYTHON_VERSION: "3.14"

jobs:
  # ==========================================================================
  # STAGE 1: LINT
  # ==========================================================================
  lint:
    name: Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff==0.17.4

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

      # Fails when a translation key is referenced nowhere, when the six
      # locales drift apart, or when a .json.gz no longer matches its .json.
      # The last one matters because Home Assistant's /local handler serves
      # the gzip when it exists, so a pruned .json alone never reaches the
      # browser (#2907).
      - name: Check i18n keys
        run: python3 scripts/check_i18n_keys.py

      # Wording, not structure (#3386): glossary terms per language, labels
      # that grow past 1.4x the English, "..." instead of "…", Spanish "¡"/"¿".
      # Warnings only: each finding is a PR annotation, the job stays green.
      # Runs on one Python only so the annotations are not listed three times.
      - name: Check i18n copy (warnings)
        if: matrix.python-version == '3.14'
        continue-on-error: true
        run: python3 scripts/check_i18n_copy.py

  # ==========================================================================
  # STAGE 1a: TYPE CHECK (mypy)
  # ==========================================================================
  # Static type checking (#1275). Runs in lenient + scoped mode: only the clean
  # subset of game/ + services/ modules listed under [tool.mypy] in
  # pyproject.toml is checked today. Catches the provider-URI-mismatch class of
  # bug (#768/#808) statically. Scope/strictness ramp up over time — see the
  # ramp-up plan in pyproject.toml.
  typecheck:
    name: Type check (mypy, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mypy
        run: pip install mypy==2.4.1

      - name: Run mypy
        # Config + scoped file list both come from [tool.mypy] in pyproject.toml.
        run: mypy
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ==========================================================================
  # STAGE 1b: FRONTEND BUILD CHECK
  # ==========================================================================
  # Rebuilds the served .min.js bundles from their .js sources and fails if any
  # committed bundle drifted. Guards against the #1263 class of bug (source edit
  # not reflected in the minified bundle that browsers actually load).
  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Seit der Lockfile im Baum liegt (#2580), traegt setup-nodes eigener
          # npm-Cache — er braucht genau diese Datei als Schluessel.
          cache: npm

      # `npm ci` statt `npm install`: es installiert exakt den Lockfile und
      # bricht ab, wenn package.json und Lockfile auseinanderlaufen. Genau das
      # ist der Sinn der Uebung — `npm install` haette die Abweichung still
      # zurechtgebogen und den Lockfile nebenbei umgeschrieben.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint JS (ESLint)
        run: npm run lint

      # #3387: hard-coded colours and sizes outside www/css/tokens.css. Warning
      # only while the design-system migration moves them onto tokens: the step
      # never fails the job, it prints the last lines and puts the count on the
      # run as an annotation. Raise to "error" in stylelint.config.mjs at the end
      # of the migration plan.
      - name: Lint CSS against hard-coded values (Stylelint, warning only)
        continue-on-error: true
        run: |
          npm run --silent lint:css -- --formatter compact > stylelint-report.txt 2>&1 || true
          tail -n 20 stylelint-report.txt
          echo "::warning title=Stylelint (#3387)::$(grep -c ' warning ' stylelint-report.txt) hard-coded values outside tokens.css"

      - name: Verify min.js bundles match source
        run: npm run build:check

      - name: Run JS unit tests with coverage (vitest)
        run: npm run test:coverage

  # ==========================================================================
  # STAGE 1c: TAP TARGETS (non-blocking, #3391)
  # ==========================================================================
  # Loads the four pages with the real HTML and CSS in a headless Chromium at
  # 375 px and measures every button, link and field: at least 44 x 44 px, at
  # least 8 px between neighbours, and a year track long enough to drag. Needs
  # a real layout engine (vitest has none), so it is its own job, and
  # `continue-on-error` keeps a browser hiccup from blocking a merge. Read the
  # job's log when it shows a warning; the exceptions are listed, with a
  # reason, in tests/ui/test_tap_targets.py.
  tap-targets:
    name: Tap targets (Chromium, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=9.2.0" playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Measure tap targets
        # --noconftest: the repo's conftest files stub Home Assistant and need
        # the full test requirements; this test needs neither.
        run: pytest tests/ui -v --tb=short -p no:cacheprovider --noconftest

  # ==========================================================================
  # STAGE 2: TEST
  # ==========================================================================
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run all tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=custom_components/beatify \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=68  # gate just below measured 69.86% (#1282); raise progressively as coverage grows

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ==========================================================================
  # STAGE 3: BURN-IN (Flaky Test Detection)
  # ==========================================================================
  burn-in:
    name: Burn-in (Flaky Detection)
    runs-on: ubuntu-latest
    needs: test
    # Only run on PRs to main or scheduled
    if: github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run burn-in loop (10 iterations)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🔥 Starting burn-in loop - 10 iterations"
          echo "Purpose: Detect flaky/non-deterministic tests"
          echo ""
          for i in {1..10}; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/10"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            pytest tests/unit/ tests/integration/ -v --tb=short || {
              echo "❌ FLAKY TEST DETECTED on iteration $i"
              echo "Tests must pass 10/10 times to be considered stable"
              exit 1
            }
            echo "✅ Iteration $i passed"
            echo ""
          done
          echo "🎉 All 10 burn-in iterations passed - tests are stable!"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-failures
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 30

  # ==========================================================================
  # STAGE 4: HA VALIDATION (Optional - requires HA dev environment)
